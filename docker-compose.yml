services:
  backend:
    build: ./web-back
    ports:
      - "3100:3100"
    env_file:
      - ./web-back/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./web-front
      args:
        VITE_API_URL: http://localhost:3100/api
        VITE_SOCKET_URL: http://localhost:3100
        VITE_OMDB_API_KEY: ${VITE_OMDB_API_KEY:-}
        VITE_GIPHY_API_KEY: ${VITE_GIPHY_API_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
