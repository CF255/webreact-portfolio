name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-back
    env:
      ACCESS_TOKEN_SECRET: ci-access-secret
      REFRESH_TOKEN_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web-back/package-lock.json

      - run: npm ci

      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-front
    env:
      VITE_API_URL: http://localhost:3100/api
      VITE_SOCKET_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web-front/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t webreact-backend ./web-back

      - name: Build frontend image
        run: docker build -t webreact-frontend ./web-front
